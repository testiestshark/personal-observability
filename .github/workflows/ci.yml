# Continuous integration: the checks that must pass before a branch is merged.
#
# These are the same four commands as `bun run verify` locally, split into steps
# so a failure names which one broke. They run on a clean Linux checkout, which
# is the point — it catches anything that only works because of the state of a
# particular developer machine.
#
# Build runs BEFORE typecheck, which is not the obvious order. src/routeTree.gen.ts
# is generated rather than committed (see .gitignore for why), and `tsc` fails on
# every route without it — the build is what writes it. Keep build ahead of
# typecheck and test if these steps are ever reordered.
#
# Runs on pull_request only — never on push, so a PR is checked once, not twice.
# main is only ever updated by merging a PR that already passed this.
#
# One job on purpose: the checks are each under a minute, so separate jobs spent
# more time on runner start-up and checkout than on the checks. The Python worker
# tests sit at the end of the same job for that reason.
#
# Nothing here touches Supabase. Every test is a pure unit or jsdom component
# test, so no database, secrets or service containers are needed. If an
# end-to-end suite is added later it belongs in a separate workflow, so a flaky
# browser run can never block this one.
name: CI

on:
  pull_request:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --frozen-lockfile fails rather than silently resolving something other
      # than what bun.lock records, so CI tests the dependency tree that is
      # actually committed.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      # First of the three, because it generates src/routeTree.gen.ts, which the
      # other two need. Also guards the build-only failure mode described in
      # docs/AUTHENTICATION.md, where a change passes in dev and breaks the
      # production bundle.
      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # The sync workers in scripts/ are Python, outside the Bun toolchain above.
      # A new worker with a test_*.py file in its folder belongs in the loop.
      # Python 3.13 matches the workers' Dockerfiles. `unittest discover` runs from
      # inside the folder because the tests import the worker module by bare name
      # (`from garmin_sync import ...`).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Not every worker has a requirements.txt (hevy is stdlib-only), so the
      # install is conditional rather than a failure.
      - name: Python worker tests
        run: |
          for worker in garmin hevy; do
            echo "::group::$worker"
            cd "scripts/$worker"
            if [ -f requirements.txt ]; then
              pip install -r requirements.txt
            fi
            python -m unittest discover -v -p "test_*.py"
            cd ../..
            echo "::endgroup::"
          done
